services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - mnemoforge_qdrant_data:/qdrant/storage
    environment:
      QDRANT_LOG_LEVEL: warn
    restart: unless-stopped

  mnemoforge:
    image: caveboy/mnemoforge:latest
    ports:
      - "${MNEMOFORGE_HTTP_PORT:-8000}:8000"
    depends_on:
      - qdrant
    env_file:
      - ${MNEMOFORGE_USER_ENV_FILE:-.env.user}
    environment:
      MNEMOFORGE_RUNTIME_KIND: docker
      MNEMOFORGE_DOCKER_SERVICE: mnemoforge
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  mnemoforge_qdrant_data:
